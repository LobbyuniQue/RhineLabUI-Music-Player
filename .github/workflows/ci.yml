name: Checks and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows-music:
    name: Windows browser and VLC integration
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RHINE_VLC_AOUT: dummy
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Locate the runner's Microsoft Edge
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          )
          $edgeBinary = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edgeBinary) { throw 'Microsoft Edge is missing from this runner.' }
          "RHINE_BROWSER=$edgeBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path '.local/ci' -Force | Out-Null
      - name: Download and verify official VLC 3.0.21
        timeout-minutes: 10
        run: |
          $vlcArchive = 'vlc-3.0.21-win64.zip'
          $vlcBase = 'https://download.videolan.org/pub/videolan/vlc/3.0.21/win64'
          $vlcChecksumPath = Join-Path $PWD '.local/ci/vlc.sha256'
          Invoke-WebRequest -Uri "$vlcBase/$vlcArchive.sha256" -OutFile $vlcChecksumPath
          $vlcExpected = ((Get-Content -LiteralPath $vlcChecksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($vlcExpected -notmatch '^[a-f0-9]{64}$') { throw 'The official VLC SHA256 is unavailable.' }
          New-Item -ItemType Directory -Path '.tools/cache' -Force | Out-Null
          $vlcZipPath = Join-Path $PWD ".tools/cache/$vlcArchive"
          Invoke-WebRequest -Uri "$vlcBase/$vlcArchive" -OutFile $vlcZipPath
          $vlcActual = (Get-FileHash -LiteralPath $vlcZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($vlcActual -ne $vlcExpected) { throw 'The VLC archive does not match the official SHA256.' }
          node scripts/fetch-vlc.mjs --version 3.0.21
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vlcInstall = Get-Content -LiteralPath '.tools/vlc-location.json' -Raw | ConvertFrom-Json
          if ($vlcInstall.sha256 -ne $vlcExpected) { throw 'The installed VLC archive checksum changed.' }
      - name: VLC bridge protocol with generated audio
        timeout-minutes: 10
        run: |
          node --experimental-strip-types scripts/check-vlc-bridge.mjs 2>&1 | Tee-Object -FilePath '.local/ci/vlc-protocol.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser music integration
        timeout-minutes: 10
        run: |
          npm.cmd run test:e2e:music 2>&1 | Tee-Object -FilePath '.local/ci/browser-music.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: VLC UI direction, disconnect and reconnect integration
        timeout-minutes: 10
        run: |
          npm.cmd run test:e2e:vlc 2>&1 | Tee-Object -FilePath '.local/ci/vlc-ui.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain integration logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-music-evidence
          path: |
            .local/ci/*.log
            .local/screenshots/music/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
